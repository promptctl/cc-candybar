# pnpm settings — the one home for both pnpm 10 (CI, mmu) and pnpm 11+.
# pnpm 11 no longer reads the package.json "pnpm" field. [LAW:one-source-of-truth]

# Install every platform's native package so release tooling can stage them.
supportedArchitectures:
  os: [ darwin, linux ]
  cpu: [ x64, arm64 ]

# esbuild and unrs-resolver ship prebuilt binaries via optionalDependencies;
# their postinstall fallbacks are intentionally never run (allowBuilds is the
# pnpm 11 key; pnpm 10 emits a cosmetic ignored-builds warning instead).
allowBuilds:
  esbuild: false
  unrs-resolver: false

# An unmet peer fails resolution instead of warning: rich-js's mobx peer
# (^7.0.3) sat unmet by mobx 6.x behind a warning nobody read.
# [LAW:no-silent-failure]
strictPeerDependencies: true

# Our own packages are trusted at publish time — exempt them from the
# supply-chain release-age delay so a fresh release installs immediately.
minimumReleaseAgeExclude:
  - "@promptctl/*"

# Pin the renderer adapters and data to the same implementation in every engine.
patchedDependencies:
  '@formatjs/intl-datetimeformat@8.2.2': patches/@formatjs__intl-datetimeformat@8.2.2.patch
  '@promptctl/go-template-js@0.10.0': patches/@promptctl__go-template-js@0.10.0.patch
  '@promptctl/rich-js@0.27.0': patches/@promptctl__rich-js@0.27.0.patch
  hdr-histogram-js@3.0.1: patches/hdr-histogram-js@3.0.1.patch
  path-browserify@1.0.1: patches/path-browserify@1.0.1.patch

# The patched Rich cell-width code owns the versioned grapheme rules.
packageExtensions:
  '@promptctl/rich-js@0.27.0':
    dependencies:
      unicode-segmenter: 0.17.3
