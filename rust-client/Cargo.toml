[package]
name = "cc-candybar"
version = "0.0.0"
edition = "2021"
publish = false

# The crate version is intentionally 0.0.0 — the npm package version is the
# source of truth. CI overrides this at build time via `cargo build
# --release` after writing the published version into Cargo.toml. Locally,
# 0.0.0 makes "what version is this binary?" obviously wrong on purpose.

[[bin]]
name = "cc-candybar"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
