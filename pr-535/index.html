<style>
  /* rich-js's Powerline subset: arrows and caps without a patched font (FONT-LICENSE). */
  @font-face {
    font-family: "Rich Powerline";
    src: url("./rich-powerline.woff2") format("woff2");
    unicode-range: U+E0A0-E0D7;
    font-display: block;
  }
  :root {
    --page: #101118; --panel: #181a24; --line: #2a2d3d; --text: #d5d8e6; --muted: #858aa3;
    --accent: #7aa2f7; --bad: #f7768e;
    --mono: "Rich Powerline", "JetBrains Mono", "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--page); color: var(--text); font: 13px/1.45 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  #nav { margin-left: auto; }
  #nav a { color: var(--accent); text-decoration: none; }
  #nav a:hover { text-decoration: underline; }
  .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .label { color: var(--muted); }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #size { font-family: var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  main { padding: 16px; display: grid; gap: 12px; }
  #about { margin: 0; max-width: 72ch; color: var(--muted); }
  #about a { color: var(--accent); }
  /* The scenario strip exists only when the transport plays one (the Pages build). */
  #scenario { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
  #caption { font-size: 14px; }
  #caption .turn { color: var(--accent); font-variant-numeric: tabular-nums; }
  #track { position: relative; height: 6px; border-radius: 3px; background: var(--line); cursor: pointer; }
  #progress { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--accent); }
  .tick { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--muted); }
  /* Drag the frame's right edge to change the columns the bar is rendered at. */
  #frame { resize: horizontal; overflow: hidden; width: 100%; max-width: 100%; min-width: 240px;
           border: 1px solid var(--line); border-radius: 4px; padding: 8px; background: var(--ground); }
  #term { width: 100%; }
  #status { font-family: var(--mono); min-height: 1.45em; white-space: pre-wrap; word-break: break-word; }
  .bad { color: var(--bad); }
  .muted { color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); }
  .links { overflow-x: auto; }
  table { border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
  td { padding: 2px 12px 2px 0; vertical-align: top; border-bottom: 1px solid var(--line); }
  td:first-child { white-space: nowrap; }
  td button { font-family: var(--mono); font-size: 12px; padding: 0 6px; }
  td.does { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { #progress { transition: none; } }

<body>
<header>
  <h1>cc-candybar · live bar</h1>
  <div class="group"><span class="label">columns</span>
    <button type="button" data-cols="80">80</button>
    <button type="button" data-cols="120">120</button>
    <button type="button" data-cols="200">200</button>
    <button type="button" id="fit">fit window</button>
  </div>
  <div class="group"><span class="label">terminal ground</span>
    <button type="button" data-ground="dark" aria-pressed="true">dark</button>
    <button type="button" data-ground="light">light</button>
  </div>
  <div class="group">
    <button type="button" id="redraw">↻ redraw</button>
    <button type="button" id="restart" title="A fresh session: nothing open, nothing saved">⟲ new session</button>
  </div>
  <span id="size"></span>
  <nav id="nav" hidden></nav>
</header>
<main>
  <p id="about" hidden></p>
  <section id="scenario" hidden>
    <div class="group">
      <button type="button" id="play">⏸ pause</button>
      <button type="button" id="replay">⟲ replay</button>
      <span class="label">speed</span>
      <button type="button" data-speed="1" aria-pressed="true">1×</button>
      <button type="button" data-speed="2">2×</button>
      <button type="button" data-speed="4">4×</button>
    </div>
    <div id="caption"></div>
    <div id="track" title="Jump to a moment"><div id="progress"></div></div>
  </section>
  <div id="frame"><div id="term"></div></div>
  <div id="status"><span class="muted">Click anything in the bar. Hover a link to see what it does.</span></div>
  <details>
    <summary>Every link on screen</summary>
    <div class="links"><table><tbody id="links"></tbody></table></div>
  </details>
</main>
<script type="module">
// The page draws what a transport answers. `pnpm bar:web` serves an HTTP transport to an
// isolated daemon; the Pages build serves one that runs the daemon in this page. Either:
//   render(size), click(url, size), restart(size) → { ansi, links: [{ text, url, does }], refused }
//   about?: string (HTML)   landscape?: string | null (path to the landscape explorer)   scenario?: see the scenario strip below
import { transport } from "./transport.js";

const GROUNDS = {
  dark: { background: "#16161e", foreground: "#c0caf5", cursor: "#16161e" },
  light: { background: "#f4f4f7", foreground: "#343b58", cursor: "#f4f4f7" },
};
// The terminal is as tall as the bar; the daemon is told a terminal of a usual height,
// as a real client would report.
const REPORTED_ROWS = 40;
// Claude Code's fastest status-line cadence (`statusLine.refreshInterval: 1`):
// the page asks for a render this often, so whatever the bar shows of the time
// moves with nobody touching the page.
const REFRESH_MS = 1000;
const $ = (id) => document.getElementById(id);
const frame = $("frame");
let view = { ansi: "", links: [] };

function say(text, cls) {
  $("status").replaceChildren(Object.assign(document.createElement("span"), { className: cls ?? "", textContent: text }));
}

const term = new Terminal({
  fontFamily: getComputedStyle(document.documentElement).getPropertyValue("--mono"),
  fontSize: 14,
  convertEol: true,
  disableStdin: true,
  cursorBlink: false,
  allowProposedApi: true,
  theme: GROUNDS.dark,
  linkHandler: {
    allowNonHttpProtocols: true,
    activate: (_event, uri) => follow(uri),
    hover: (_event, uri) => {
      const link = view.links.find((l) => l.url === uri);
      say(link ? `${link.text}  →  ${link.does}` : uri, "muted");
    },
    leave: () => {},
  },
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.loadAddon(new Unicode11Addon.Unicode11Addon());
term.unicode.activeVersion = "11";

const size = () => ({ width: term.cols, rows: REPORTED_ROWS });
const fitCols = () => fit.proposeDimensions()?.cols ?? term.cols;

// Only what changed is redrawn: the page redraws every second, and rewriting the
// terminal or the table each time would drop a hover, a half-made click, or focus.
// xterm drops a link's hover, and a press on it, whenever the row under it is
// written, so a bar of the same shape is rewritten row by row, only where the
// row's bytes differ: a clock ticking on one row leaves the others untouched.
let drawnAt = { lines: [], cols: 0, links: "" };
function draw(next) {
  view = next;
  $("size").textContent = `${term.cols} columns`;
  const lines = next.ansi.replace(/\n$/, "").split("\n");
  if (term.cols !== drawnAt.cols || lines.length !== drawnAt.lines.length) {
    term.resize(term.cols, Math.max(lines.length, 4));
    term.reset();
    term.write("\x1b[?25l" + lines.join("\n"));
  } else {
    term.write(lines.map((line, i) =>
      line === drawnAt.lines[i] ? "" : `\x1b[${i + 1};1H\x1b[0m\x1b[2K${line}`).join(""));
  }
  const links = JSON.stringify(next.links);
  if (links !== drawnAt.links) drawLinks(next.links);
  drawnAt = { lines, cols: term.cols, links };
}

function drawLinks(links) {
  $("links").replaceChildren(...links.map((l) => {
    const go = Object.assign(document.createElement("button"), { type: "button", textContent: l.text || "(blank)" });
    go.addEventListener("click", () => follow(l.url));
    const cell = document.createElement("td");
    cell.append(go);
    const row = document.createElement("tr");
    row.append(cell, Object.assign(document.createElement("td"), { className: "does", textContent: l.does }));
    return row;
  }));
}

// One call at a time, each against the render the page last drew. A redraw asked for while
// one is running is folded into a single redraw after it.
let running = Promise.resolve();
let redrawQueued = false;
function call(work) {
  const next = running.then(async () => {
    try {
      const answer = await work();
      draw(answer);
      return answer;
    } catch (e) {
      say(e.message, "bad");
      return null;
    }
  });
  running = next;
  return next;
}
function redraw() {
  if (redrawQueued) return;
  redrawQueued = true;
  running.then(() => {
    redrawQueued = false;
    call(() => transport.render(size()));
  });
}

async function follow(url) {
  // Links outside the bar's scheme are the terminal's: a page opens in a tab, never in the daemon.
  if (!url.startsWith("cc-candybar://")) {
    if (/^https?:/.test(url)) window.open(url, "_blank", "noopener");
    say(`opens ${url}`, "muted");
    return;
  }
  const link = view.links.find((l) => l.url === url);
  // Started now, not queued behind a redraw: a copy happens only inside the click's own
  // gesture. Its answer is drawn in turn.
  const clicked = transport.click(url, size());
  const answer = await call(() => clicked);
  if (answer === null) return;
  say(answer.refused ? `${link?.text ?? url}: ${answer.refused}` : `clicked ${link?.text ?? url}`, answer.refused ? "bad" : "muted");
}

let resizeTimer;
function refit() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const cols = fitCols();
    if (cols === term.cols) return;
    term.resize(cols, term.rows);
    redraw();
  }, 120);
}

function setCols(cols) {
  // Move the frame by whole cells, then ask the fit itself: the leftover past the last
  // whole cell rounds with the width, so a pixel either way can gain or lose a column.
  const cell = term.element.querySelector(".xterm-screen").getBoundingClientRect().width / term.cols;
  let width = Math.round(frame.getBoundingClientRect().width + (cols - term.cols) * cell);
  frame.style.width = `${width}px`;
  for (let nudge = 0; nudge < Math.ceil(cell) && fitCols() !== cols; nudge++) {
    width += Math.sign(cols - fitCols());
    frame.style.width = `${width}px`;
  }
}

const press = (selector, chosen) =>
  document.querySelectorAll(selector).forEach((o) => o.setAttribute("aria-pressed", String(o === chosen)));
$("fit").addEventListener("click", () => { frame.style.width = "100%"; });
document.querySelectorAll("[data-ground]").forEach((b) => b.addEventListener("click", () => {
  term.options.theme = GROUNDS[b.dataset.ground];
  frame.style.setProperty("--ground", GROUNDS[b.dataset.ground].background);
  press("[data-ground]", b);
}));

// The scenario strip: a transport that plays Claude turns over time says so with `scenario`:
//   steps: [{ turn, caption }]   subscribe(({ index, playing, progress }) => …) — called whenever the world moves
//   play() pause() replay() seek(fraction) setSpeed(n)
function mountScenario(scenario) {
  $("scenario").hidden = false;
  const turns = Math.max(...scenario.steps.map((s) => s.turn));
  $("track").append(...scenario.steps.map((s) => {
    const tick = Object.assign(document.createElement("div"), { className: "tick", title: s.caption });
    tick.style.left = `${s.at * 100}%`;
    return tick;
  }));
  scenario.subscribe(({ index, playing, progress }) => {
    const step = scenario.steps[index];
    $("caption").replaceChildren(
      Object.assign(document.createElement("span"), { className: "turn", textContent: step.turn === 0 ? "Before the first turn · " : `Turn ${step.turn} of ${turns} · ` }),
      document.createTextNode(step.caption),
    );
    $("progress").style.width = `${progress * 100}%`;
    $("play").textContent = playing ? "⏸ pause" : "▶ play";
    redraw();
  });
  $("play").addEventListener("click", () => (scenario.playing() ? scenario.pause() : scenario.play()));
  $("replay").addEventListener("click", () => scenario.replay());
  $("track").addEventListener("click", (e) => {
    const box = $("track").getBoundingClientRect();
    scenario.seek(Math.min(1, Math.max(0, (e.clientX - box.left) / box.width)));
  });
  document.querySelectorAll("[data-speed]").forEach((b) => b.addEventListener("click", () => {
    scenario.setSpeed(Number(b.dataset.speed));
    press("[data-speed]", b);
  }));
}

// Measure cells only once the Powerline face is loaded, or the arrows are measured in a fallback.
document.fonts.load("14px 'Rich Powerline'", "").then(() => {
  frame.style.setProperty("--ground", GROUNDS.dark.background);
  term.open($("term"));
  term.resize(fitCols(), term.rows);
  new ResizeObserver(refit).observe(frame);
  // The controls that measure or draw the terminal exist only once it does.
  document.querySelectorAll("[data-cols]").forEach((b) => b.addEventListener("click", () => setCols(Number(b.dataset.cols))));
  $("redraw").addEventListener("click", redraw);
  $("restart").addEventListener("click", async () => {
    if (await call(() => transport.restart(size()))) say("new session", "muted");
  });
  if (transport.about) {
    $("about").innerHTML = transport.about;
    $("about").hidden = false;
  }
  if (transport.landscape) {
    const a = document.createElement("a");
    a.href = transport.landscape;
    a.textContent = "Statusline landscape →";
    $("nav").append(a);
    $("nav").hidden = false;
  }
  if (transport.scenario) mountScenario(transport.scenario);
  redraw();
  setInterval(redraw, REFRESH_MS);
});
</script>

 class assignment at construction time, then CSS does the rest. */\n.drawer.edge-right {\n  right: 0;\n  transform: translate(var(--panel-width), -50%);\n}\n.drawer.edge-right:hover:not(.open) {\n  transform: translate(calc(var(--panel-width) - var(--peek)), -50%);\n}\n.drawer.edge-right.open {\n  transform: translate(0, -50%);\n}\n.drawer.edge-left {\n  left: 0;\n  flex-direction: row-reverse;\n  transform: translate(calc(-1 * var(--panel-width)), -50%);\n}\n.drawer.edge-left:hover:not(.open) {\n  transform: translate(calc(-1 * (var(--panel-width) - var(--peek))), -50%);\n}\n.drawer.edge-left.open {\n  transform: translate(0, -50%);\n}\n.handle {\n  width: var(--handle-width);\n  background: var(--handle-bg);\n  color: var(--handle-fg);\n  border: none;\n  cursor: pointer;\n  /* Padding is content-driven; the icon and label have their own transitions and the\n     handle shrink-wraps to match (no min-height). */\n  padding: 8px 6px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: 0;\n  font-family: inherit;\n  font-weight: 600;\n  letter-spacing: 0.01em;\n  flex: 0 0 auto;\n  transition: padding 180ms ease-out, filter 180ms ease-out;\n}\n/* [LAW:single-enforcer] Hover darkening uses CSS filter rather than a separate\n   --handle-bg-hover variable so it works for any user-provided color without forcing\n   the user to specify two shades. */\n.handle:hover { filter: brightness(0.92); }\n.handle:focus-visible {\n  outline: 2px solid #ffffff;\n  outline-offset: -4px;\n}\n/* Right-edge handle: rounded LEFT side (the side facing the viewport). */\n.drawer.edge-right .handle {\n  border-top-left-radius: 14px;\n  border-bottom-left-radius: 14px;\n  box-shadow: -4px 0 16px rgba(0,0,0,0.22), inset 1px 0 0 rgba(255,255,255,0.15);\n}\n/* Left-edge handle: rounded RIGHT side (the side facing the viewport). */\n.drawer.edge-left .handle {\n  border-top-right-radius: 14px;\n  border-bottom-right-radius: 14px;\n  box-shadow: 4px 0 16px rgba(0,0,0,0.22), inset -1px 0 0 rgba(255,255,255,0.15);\n}\n/* [LAW:dataflow-not-control-flow] Closed state shows a small icon only. Hover or open\n   state expands the icon and reveals the label. The CSS always applies, the difference\n   is data — the .open class and the :hover pseudo. No JS state-toggling for these. */\n.handle svg {\n  width: 12px;\n  height: 12px;\n  flex-shrink: 0;\n  display: block;\n  transition: width 180ms ease-out, height 180ms ease-out;\n}\n.drawer:hover .handle svg,\n.drawer.open .handle svg {\n  width: 22px;\n  height: 22px;\n}\n.handle .ver {\n  font-size: 11px;\n  line-height: 1.15;\n  max-width: 40px;\n  max-height: 0;\n  margin-top: 0;\n  opacity: 0;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n  font-variant-numeric: tabular-nums;\n  text-align: center;\n  transition: max-height 180ms ease-out, opacity 180ms ease-out, margin-top 180ms ease-out;\n}\n.drawer:hover .handle .ver,\n.drawer.open .handle .ver {\n  max-height: 16px;\n  margin-top: 6px;\n  opacity: 1;\n}\n.panel {\n  width: var(--panel-width);\n  max-height: 60vh;\n  overflow-y: auto;\n  background: var(--widget-bg);\n  color: var(--widget-fg);\n  border: 1px solid var(--widget-border);\n  padding: 12px;\n  flex: 0 0 auto;\n}\n.drawer.edge-right .panel {\n  border-right: none;\n  box-shadow: -8px 0 24px rgba(0,0,0,0.18);\n}\n.drawer.edge-left .panel {\n  border-left: none;\n  box-shadow: 8px 0 24px rgba(0,0,0,0.18);\n}\n.panel h2 { font-size: 13px; margin: 0 0 8px 0; font-weight: 600; }\n.index-link {\n  display: block;\n  padding: 8px 12px;\n  color: var(--widget-accent);\n  text-decoration: none;\n  border-radius: 6px;\n  margin-bottom: 4px;\n}\n.index-link:hover { background: var(--widget-bg-hover); }\n.index-link:focus-visible { outline: 2px solid var(--widget-accent); outline-offset: 2px; }\n.rows { display: flex; flex-direction: column; gap: 2px; }\n.row {\n  display: block;\n  padding: 8px 12px;\n  border-radius: 6px;\n  text-decoration: none;\n  color: var(--widget-fg);\n}\n.row:hover { background: var(--widget-bg-hover); }\n.row:focus-visible { outline: 2px solid var(--widget-accent); outline-offset: 2px; }\n.row .ver { font-weight: 600; }\n.row.current { background: var(--widget-current-bg); cursor: default; }\n.row .ref { font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace; font-size: 12px; color: var(--widget-fg-muted); }\n.badge {\n  display: inline-block;\n  font-size: 10px;\n  padding: 1px 6px;\n  border-radius: 10px;\n  background: var(--widget-accent);\n  color: #fff;\n  margin-left: 6px;\n  vertical-align: middle;\n}\n.state { padding: 8px 12px; color: var(--widget-fg-muted); }\n@media (max-width: 600px) {\n  .root { --panel-width: calc(100vw - 72px); }\n}\n";
  var SHADOW_HTML = "\n<div class=\"root\">\n  <div class=\"drawer\" role=\"region\" aria-label=\"Version switcher\">\n    <button class=\"handle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"gh-pm-nav-panel\" aria-label=\"Switch version\">\n      <span class=\"icon-slot\"><\/span>\n      <span class=\"ver\"><\/span>\n    <\/button>\n    <div class=\"panel\" id=\"gh-pm-nav-panel\" role=\"dialog\" aria-label=\"Versions\">\n      <h2>Versions<\/h2>\n      <a class=\"index-link\" href=\"\">← Index<\/a>\n      <div class=\"rows\"><div class=\"state\">Loading versions…<\/div><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n";
  if (customElements.get('gh-pm-nav')) return;
  var GhPmNav = function(){};

        this._error = null;
        this._drawer = root.querySelector('.drawer');
        this._handle = root.querySelector('.handle');
        this._panel = root.querySelector('.panel');
        this._rows = root.querySelector('.rows');

        // Substitute {version} in the label template, then assign via textContent
        // (no HTML interpretation).
        var verSpan = root.querySelector('.handle .ver');
        var labelText = LABEL_TEMPLATE.split('{version}').join(CURRENT);
        if (verSpan) { verSpan.textContent = labelText; }

        if (rootEl) {

          });

            html += '<div class="row current"><span class="ver">' + safeName + '</span><span class="badge">current</span><div class="ref">' + safeRef + '</div></div>';
          } else {
            html += '<a class="row" href="../' + encodeURIComponent(name) + '/"><span class="ver">' + safeName + '</span><div class="ref">' + safeRef + '</div></a>';
