name: Pages

# One site, published by gh-pages-multiplexer to a version folder per ref: main/ for the main branch,
# pr-<n>/ for each pull request, with a sticky comment on the PR linking its preview. Each version
# holds the main site at its root and the statusline landscape explorer under landscape/.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # the multiplexer pushes gh-pages
  pull-requests: write   # the sticky preview comment

# A deploy from one ref must not cancel another's; the multiplexer retries lost pushes itself.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the multiplexer reads git history for each version's manifest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build main site
        run: pnpm run site:build

      - name: Build landscape explorer
        run: |
          cd design-docs/peer-exploration/5-landscape/explorer
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build

      - name: Assemble the version
        run: |
          rm -rf published
          cp -R site/dist published
          mkdir -p published/landscape
          cp -R design-docs/peer-exploration/5-landscape/site/. published/landscape/

      - name: Deploy with gh-pages-multiplexer
        uses: brandon-fryslie/gh-pages-multiplexer@v1
        with:
          source-dir: published
          ref-patterns: main,pr-*
