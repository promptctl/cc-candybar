name: Pages

# One site, published by gh-pages-multiplexer to a version folder per ref: main/ for the main branch,
# pr-<n>/ for each pull request, with a sticky comment on the PR linking its preview. Each version
# holds the main site at its root and the statusline landscape explorer under landscape/.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The build runs every package's install scripts, so it holds a read-only token and keeps no
# credentials in the checkout; only the deploy job, which runs no package code, can write.
permissions:
  contents: read

# A deploy from one ref must not cancel another's; the multiplexer retries lost pushes itself.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# [LAW:one-source-of-truth] where the explorer sits beside the live bar: the assemble step publishes
# it here, and both builds derive their links to each other from it.
env:
  LANDSCAPE_DIR: landscape

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build main site
        run: pnpm run site:build

      - name: Build landscape explorer
        run: |
          cd design-docs/peer-exploration/5-landscape/explorer
          # the committed bars are checked again for credential shapes before anything is published
          python3 -I ../tools/credentials.py public/bars/*.js public/detail/*.js
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build

      - name: Assemble the version
        run: |
          rm -rf published
          cp -R site/dist published
          mkdir -p "published/$LANDSCAPE_DIR"
          cp -R design-docs/peer-exploration/5-landscape/site/. "published/$LANDSCAPE_DIR/"

      - name: Hand the version to the deploy
        uses: actions/upload-artifact@v4
        with:
          name: published
          path: published
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    # A fork's pull request gets a read-only token whatever `permissions:` says, so it can neither
    # push gh-pages nor comment: it builds, which is the check, and publishes nothing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the multiplexer pushes gh-pages
      pull-requests: write   # the sticky preview comment
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the multiplexer reads git history for each version's manifest

      - name: Take the built version
        uses: actions/download-artifact@v4
        with:
          name: published
          path: published

      - name: Deploy with gh-pages-multiplexer
        uses: brandon-fryslie/gh-pages-multiplexer@v1
        with:
          source-dir: published
          ref-patterns: main,pr-*
