name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # [LAW:single-enforcer] The checks a commit must pass run as parallel jobs,
  # and `Test` below is the one gate over all of them: the ruleset requires it,
  # and the release jobs wait on it. The run is held to 5 minutes, so each job
  # before the gate times out at 4 and the gate at 1.

  checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node setup
        uses: ./.github/actions/node-setup

      - name: Lint
        run: pnpm run lint

      # The one type check (jest.config.js's transform transpiles only).
      - name: Typecheck
        run: pnpm run typecheck

      # The committed schema is what editors fetch from main; nothing in this
      # job may regenerate it before the guard reads it.
      - name: Schema drift guard
        run: pnpm run check:schema

      # Covers the Rust client, the vendored statusline push and the Swift
      # URL handler, by reading their sources: no toolchain needed here.
      - name: Protocol-version guard
        run: pnpm run check:protocol

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust tests (spawn-boundary guard)
        run: cargo test --manifest-path rust-client/Cargo.toml

  # Each test job keeps its run's records (test-records/<run>.jsonl) as an
  # artifact, red or green, and `Test` reports over all of them. The three runs
  # are the whole suite: each selects a directory and the others ignore it.
  test-unit:
    name: Test the unit tier
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node setup
        uses: ./.github/actions/node-setup

      - name: Test the unit tier
        run: pnpm test:unit

      - name: Keep the test records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-records-unit
          path: test-records/
          if-no-files-found: error
          retention-days: 1

  # [LAW:verifiable-goals] No build in this job, so a test outside the process
  # tier that comes to need one fails here.
  test-worker:
    name: Test outside the process tier (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        # [LAW:one-source-of-truth] The shard count is this list's length.
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node setup
        uses: ./.github/actions/node-setup

      - name: Test outside the process tier
        run: pnpm test:worker --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Keep the test records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-records-worker-${{ matrix.shard }}
          path: test-records/
          if-no-files-found: error
          retention-days: 1

  test-process:
    name: Test the process tier
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node setup
        uses: ./.github/actions/node-setup

      - name: Build
        run: pnpm run build

      - name: Test the process tier
        run: pnpm test:process

      # [LAW:single-enforcer] The only run of test/e2e/: the sign-off's cap and
      # assertion limit are checked here, and every other config ignores the directory.
      - name: Test end-to-end
        run: pnpm test:e2e

      - name: Keep the test records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-records-process
          path: test-records/
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [checks, test-unit, test-worker, test-process]
    # Runs after a red job too: a red run is the one whose records matter most.
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node setup
        uses: ./.github/actions/node-setup

      - name: Download the test records
        uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: test-records-*

      # Each job wrote <run>.jsonl for the files it ran; a run's shards are
      # disjoint, so their records joined are the run's records.
      - name: Join the test records
        run: |
          set -euo pipefail
          mkdir -p test-records
          for file in shards/*/*.jsonl; do
            cat "$file" >> "test-records/$(basename "$file")"
          done

      # One record per test file, kept so a number about the suite is read from
      # a run and not remembered. The report fails on a run that left none.
      - name: Report tests by layer
        run: pnpm test:report --runs unit,worker,process

      - name: Keep the test records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-records
          path: test-records/
          if-no-files-found: error

      # [LAW:no-silent-failure] The gate: every job above passed, or this
      # names the ones that did not.
      - name: Every check passed
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::checks that did not pass:"$'\n'"$failed"
            exit 1
          fi

  build-rust:
    name: Build native binary (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 4
    # All targets cross-compiled from Linux via cargo-zigbuild. Zig acts as
    # the linker and ships a stub macOS SDK sufficient for binaries that
    # only use libc + libSystem (this one does — see rust-client/Cargo.toml).
    # No macOS runners involved.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
          - platform: darwin-x64
            target: x86_64-apple-darwin
          - platform: darwin-arm64
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-client/target
          key: cargo-${{ matrix.platform }}-${{ hashFiles('rust-client/Cargo.lock') }}

      - name: Build release binary
        working-directory: rust-client
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-candybar-${{ matrix.platform }}
          path: rust-client/target/${{ matrix.target }}/release/cc-candybar
          if-no-files-found: error
          retention-days: 1

  # The URL handler app (url-handler/main.swift): a resident macOS agent that
  # forwards a cc-candybar:// link to the daemon. Swift needs a macOS runner;
  # one universal binary serves both darwin packages. What it decides from the
  # wire (url-handler/wire.swift) is checked here first, since only a macOS
  # runner can compile it.
  build-url-handler:
    name: Build URL handler app (darwin universal)
    runs-on: macos-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the wire reads
        run: ./url-handler/check.sh

      - name: Build universal binary
        run: ./url-handler/build.sh build/cc-candybar-url-handler

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-candybar-url-handler
          path: build/cc-candybar-url-handler
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, build-rust, build-url-handler]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Node setup
        uses: ./.github/actions/node-setup

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx semantic-release

  # The tag is the release: semantic-release pushes it from the job above, and
  # a tag the repository refuses never starts this job, so nothing reaches npm
  # for it. The binaries are built from the tagged commit.
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # publish.mjs waits up to 10 minutes for the registry to serve the platform
    # packages before it publishes the main one, and the registry's pace is not
    # ours to set: v1.236.13's took over four. This only has to sit above that
    # wait, so a cap under it cancels a release the registry is still accepting.
    timeout-minutes: 15
    needs: [test, build-rust, build-url-handler]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node setup
        uses: ./.github/actions/node-setup

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cc-candybar-*

      - name: Stage binaries into platform packages
        run: |
          set -euo pipefail
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            mkdir -p "npm/cc-candybar-${platform}/bin"
            cp "artifacts/cc-candybar-${platform}/cc-candybar" \
               "npm/cc-candybar-${platform}/bin/cc-candybar"
            chmod 0755 "npm/cc-candybar-${platform}/bin/cc-candybar"
            file "npm/cc-candybar-${platform}/bin/cc-candybar"
          done
          # The URL handler app's binary, which `cc-candybar install` wraps in
          # an app bundle (src/install/index.ts FORWARDER_BIN names it).
          for platform in darwin-arm64 darwin-x64; do
            cp "artifacts/cc-candybar-url-handler/cc-candybar-url-handler" \
               "npm/cc-candybar-${platform}/bin/cc-candybar-url-handler"
            chmod 0755 "npm/cc-candybar-${platform}/bin/cc-candybar-url-handler"
            file "npm/cc-candybar-${platform}/bin/cc-candybar-url-handler"
          done

      # [LAW:one-source-of-truth] npm holds who may publish: each @promptctl
      # package names this repo and this workflow file as its trusted
      # publisher, and the job's OIDC identity (id-token: write above) is the
      # credential. No token is stored, so none expires. Trusted publishing
      # needs npm 11.5.1 or newer, and Node 22 ships an older one; without it
      # npm answers an unauthorized publish with a bare E404.
      - name: Newer npm for trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Publish
        run: node scripts/publish.mjs "${{ github.ref_name }}"
