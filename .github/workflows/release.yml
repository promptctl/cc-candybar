name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The ratchet on daemon boots only falls: its case count and the ceiling on
      # real daemon starts are numbers in one file (test/transitional-daemon-boots).
      # The script fetches the base commit itself, which this depth-1 checkout lacks.
      - name: Daemon-boot ratchet only falls
        if: github.event_name == 'pull_request'
        run: node scripts/check-shrinks.cjs test/transitional-daemon-boots/ratchet.json ${{ github.event.pull_request.base.sha }}

      - name: Lint
        run: pnpm run lint

      # The one type check (jest.config.js's transform transpiles only).
      - name: Typecheck
        run: pnpm run typecheck

      # The committed schema is what editors fetch from main; nothing in this
      # job may regenerate it before the guard reads it.
      - name: Schema drift guard
        run: pnpm run check:schema

      # [LAW:verifiable-goals] Before the build, so a test outside the process
      # tier that comes to need one fails here. The three test steps are the whole
      # suite: each run selects a directory and the others ignore it.
      - name: Test the unit tier
        id: unit
        run: pnpm test:unit

      - name: Test outside the process tier
        id: worker
        run: pnpm test:worker

      - name: Build
        run: pnpm run build

      - name: Test the process tier
        id: process
        run: pnpm test:process

      # [LAW:single-enforcer] The only run of test/e2e/: the sign-off's cap and
      # assertion limit are checked here, and every other config ignores the directory.
      - name: Test end-to-end
        run: pnpm test:e2e

      # Covers the Rust client, the vendored statusline push and the Swift
      # URL handler, by reading their sources: no toolchain needed here.
      - name: Protocol-version guard
        run: pnpm run check:protocol

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust tests (spawn-boundary guard)
        run: cargo test --manifest-path rust-client/Cargo.toml

      # [LAW:single-enforcer] The cases under test/daemon-boots/ equal the ratchet,
      # counted from the two booting runs' records. `always()` so a red test run
      # still says what the count was, and before the report so the records it
      # reads exist. Each of the three trailing steps also waits for the tiers
      # whose records it reads to have run: a tier skipped or cancelled by an
      # earlier failure left no complete records, and the throw for that only
      # restates the failure. So a red worker run reports no count: the process
      # tier never ran.
      - name: Daemon-boot cases equal the ratchet
        if: always() && !contains(fromJSON('["skipped","cancelled"]'), steps.worker.outcome) && !contains(fromJSON('["skipped","cancelled"]'), steps.process.outcome)
        run: node scripts/check-boot-ratchet.mjs --runs worker,process

      # One record per test file, kept so a number about the suite is read from
      # a run and not remembered. `always()` because a red run is the one whose
      # records matter most, and last so a failed report cannot skip a gate.
      - name: Report tests by layer
        if: always() && !contains(fromJSON('["skipped","cancelled"]'), steps.unit.outcome) && !contains(fromJSON('["skipped","cancelled"]'), steps.worker.outcome) && !contains(fromJSON('["skipped","cancelled"]'), steps.process.outcome)
        run: pnpm test:report --runs unit,worker,process

      - name: Keep the test records
        if: always() && !contains(fromJSON('["skipped","cancelled"]'), steps.unit.outcome)
        uses: actions/upload-artifact@v4
        with:
          name: test-records
          path: test-records/
          if-no-files-found: error

  build-rust:
    name: Build native binary (${{ matrix.platform }})
    runs-on: ubuntu-latest
    # All targets cross-compiled from Linux via cargo-zigbuild. Zig acts as
    # the linker and ships a stub macOS SDK sufficient for binaries that
    # only use libc + libSystem (this one does — see rust-client/Cargo.toml).
    # No macOS runners involved.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
          - platform: darwin-x64
            target: x86_64-apple-darwin
          - platform: darwin-arm64
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-client/target
          key: cargo-${{ matrix.platform }}-${{ hashFiles('rust-client/Cargo.lock') }}

      - name: Build release binary
        working-directory: rust-client
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-candybar-${{ matrix.platform }}
          path: rust-client/target/${{ matrix.target }}/release/cc-candybar
          if-no-files-found: error
          retention-days: 1

  # The Rust client's own tests on macOS: the test job runs them on Linux only,
  # and the client reads its parent's start from the darwin kernel
  # (rust-client/src/process_start.rs), which only a macOS runner reaches. That
  # read must render the token `ps` prints, or every session's record reads as
  # one an exited Claude Code left.
  test-rust-darwin:
    name: Rust tests (darwin)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust tests
        run: cargo test --manifest-path rust-client/Cargo.toml

  # The URL handler app (url-handler/main.swift): a resident macOS agent that
  # forwards a cc-candybar:// link to the renderer it names. Swift needs a macOS runner;
  # one universal binary serves both darwin packages.
  build-url-handler:
    name: Build URL handler app (darwin universal)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test the address rule
        run: ./url-handler/test.sh

      - name: Build universal binary
        run: ./url-handler/build.sh build/cc-candybar-url-handler

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-candybar-url-handler
          path: build/cc-candybar-url-handler
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, test-rust-darwin, build-rust, build-url-handler]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx semantic-release

  # The tag is the release: semantic-release pushes it from the job above, and
  # a tag the repository refuses never starts this job, so nothing reaches npm
  # for it. The binaries are built from the tagged commit.
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [test, test-rust-darwin, build-rust, build-url-handler]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cc-candybar-*

      - name: Stage binaries into platform packages
        run: |
          set -euo pipefail
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            mkdir -p "npm/cc-candybar-${platform}/bin"
            cp "artifacts/cc-candybar-${platform}/cc-candybar" \
               "npm/cc-candybar-${platform}/bin/cc-candybar"
            chmod 0755 "npm/cc-candybar-${platform}/bin/cc-candybar"
            file "npm/cc-candybar-${platform}/bin/cc-candybar"
          done
          # The URL handler app's binary, which `cc-candybar install` wraps in
          # an app bundle (src/install/index.ts FORWARDER_BIN names it).
          for platform in darwin-arm64 darwin-x64; do
            cp "artifacts/cc-candybar-url-handler/cc-candybar-url-handler" \
               "npm/cc-candybar-${platform}/bin/cc-candybar-url-handler"
            chmod 0755 "npm/cc-candybar-${platform}/bin/cc-candybar-url-handler"
            file "npm/cc-candybar-${platform}/bin/cc-candybar-url-handler"
          done

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish.mjs "${{ github.ref_name }}"
