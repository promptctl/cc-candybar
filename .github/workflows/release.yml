name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Protocol-version guard
        run: pnpm run check:protocol

  build-rust:
    name: Build native binary (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    # Native builds on actual hardware — no cross-compile dance, simplest CI
    # surface to debug. GitHub provides arm64 runners for both macOS and
    # Linux, so each platform builds on its own machine.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - platform: darwin-x64
            runner: macos-13
            target: x86_64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-client/target
          key: cargo-${{ matrix.platform }}-${{ hashFiles('rust-client/Cargo.lock') }}

      - name: Build release binary
        working-directory: rust-client
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-candybar-${{ matrix.platform }}
          path: rust-client/target/${{ matrix.target }}/release/cc-candybar
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, build-rust]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cc-candybar-*

      - name: Stage binaries into platform packages
        run: |
          set -euo pipefail
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            mkdir -p "npm/cc-candybar-${platform}/bin"
            cp "artifacts/cc-candybar-${platform}/cc-candybar" \
               "npm/cc-candybar-${platform}/bin/cc-candybar"
            chmod 0755 "npm/cc-candybar-${platform}/bin/cc-candybar"
            file "npm/cc-candybar-${platform}/bin/cc-candybar"
          done

      - name: Build TypeScript
        run: pnpm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
