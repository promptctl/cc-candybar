name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Protocol-version guard
        run: pnpm run check:protocol

      - name: Rust tests (spawn-boundary guard)
        run: cargo test --manifest-path rust-client/Cargo.toml

  build-rust:
    name: Build native binary (${{ matrix.platform }})
    runs-on: ubuntu-latest
    # All targets cross-compiled from Linux via cargo-zigbuild. Zig acts as
    # the linker and ships a stub macOS SDK sufficient for binaries that
    # only use libc + libSystem (this one does — see rust-client/Cargo.toml).
    # No macOS runners involved.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
          - platform: darwin-x64
            target: x86_64-apple-darwin
          - platform: darwin-arm64
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-client/target
          key: cargo-${{ matrix.platform }}-${{ hashFiles('rust-client/Cargo.lock') }}

      - name: Build release binary
        working-directory: rust-client
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-candybar-${{ matrix.platform }}
          path: rust-client/target/${{ matrix.target }}/release/cc-candybar
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, build-rust]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cc-candybar-*

      - name: Stage binaries into platform packages
        run: |
          set -euo pipefail
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            mkdir -p "npm/cc-candybar-${platform}/bin"
            cp "artifacts/cc-candybar-${platform}/cc-candybar" \
               "npm/cc-candybar-${platform}/bin/cc-candybar"
            chmod 0755 "npm/cc-candybar-${platform}/bin/cc-candybar"
            file "npm/cc-candybar-${platform}/bin/cc-candybar"
          done

      - name: Build TypeScript
        run: pnpm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
