name: Colour audits

# The registry-wide colour audits (audits/README.md): every bundled theme
# under every style, ground and colour depth, walked through the colour model.
# Minutes per file, so they run here nightly and nowhere else. No push, no
# pull_request, no workflow_dispatch: an audit is never a status check on a
# PR or on main, and nothing is ever gated on one. The runner itself refuses
# any event but `schedule` (audits/jest.config.js).
on:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read

jobs:
  audit:
    name: Colour audits
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Colour audits
        run: pnpm run audit:colour
